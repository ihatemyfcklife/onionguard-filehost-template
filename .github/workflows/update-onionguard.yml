name: Update OnionGuard

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [onionguard-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dependency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Update OnionGuard to latest
        run: |
          go get github.com/ihatemyfcklife/onionguard@latest
          go mod tidy

      - name: Run tests with race detector
        run: |
          go test -v -race ./...

      - name: Detect changes
        id: git-check
        run: |
          if git diff --quiet go.mod go.sum; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updates
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(grep 'github.com/ihatemyfcklife/onionguard' go.mod | awk '{print $2}')
          git commit -am "chore(deps): update onionguard to ${NEW_VERSION}"
          git push origin main
